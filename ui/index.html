<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101918" />
    <meta name="description" content="ReplyTrail keeps every team response on track with ordered, durable escalation paths." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ReplyTrail — keep every response on track</title>
    <!-- Restore the saved theme before React mounts to avoid a light-mode flash. -->
    <script>
      try {
        if (localStorage.getItem('replytrail.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
