apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: alertops
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: alertops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379