apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: alertops
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: alertops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672